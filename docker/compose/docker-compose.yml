# Jogger: production stack. See docs/INSTALL.md.
#   cp .env.production.example .env   # then edit it
#   docker compose -f docker/compose/docker-compose.yml --env-file .env up -d
# Profiles:  --profile https       Caddy with automatic certificates for JOGGER_DOMAIN
#            --profile local-host  an agent on this machine, so jobs run here too
name: jogger

x-app: &app
  image: ${JOGGER_IMAGE:-ghcr.io/patrickepatate/jogger:latest}
  restart: unless-stopped
  env_file: ../../.env
  environment: &app-env
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    REDIS_HOST: redis
    REVERB_HOST: reverb
    REVERB_PORT: "8080"
    REVERB_SCHEME: http
    JOGGER_ROLE: worker
  volumes:
    - app-storage:/var/www/html/storage/app
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  app:
    <<: *app
    environment:
      <<: *app-env
      JOGGER_ROLE: app
    command: ["app"]
    ports:
      - "${JOGGER_HTTP_PORT:-8000}:8000"

  reverb:
    <<: *app
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    ports:
      - "${JOGGER_REVERB_PORT:-8080}:8080"
    depends_on:
      app: { condition: service_healthy }

  horizon:
    <<: *app
    command: ["php", "artisan", "horizon"]
    stop_grace_period: 60s
    depends_on:
      app: { condition: service_healthy }

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      app: { condition: service_healthy }

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-jogger}
      POSTGRES_USER: ${DB_USERNAME:-jogger}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-jogger} -d ${DB_DATABASE:-jogger}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  caddy:
    profiles: ["https"]
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      JOGGER_DOMAIN: ${JOGGER_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - app
      - reverb

  # Optional: run jobs on the server's own machine. Off by default: this container controls the host's Docker.
  agent:
    profiles: ["local-host"]
    image: ${JOGGER_AGENT_IMAGE:-ghcr.io/patrickepatate/jogger-agent:latest}
    restart: unless-stopped
    # The image runs as nonroot; the group must match the Docker socket's group on this machine.
    group_add:
      - "${DOCKER_GID:-999}"
    environment:
      JOGGER_SERVER: http://app:8000
      JOGGER_ENROLL_TOKEN: ${JOGGER_LOCAL_HOST_TOKEN:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - agent-data:/var/lib/jogger-agent
    depends_on:
      app: { condition: service_healthy }

volumes:
  app-storage:
  postgres-data:
  redis-data:
  agent-data:
  caddy-data:
