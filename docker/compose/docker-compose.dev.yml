name: jogger-dev

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: jogger
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: jogger
    ports:
      - "${FORWARD_DB_PORT:-5432}:5432"
    volumes:
      - pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jogger -d jogger"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${FORWARD_REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pg:
