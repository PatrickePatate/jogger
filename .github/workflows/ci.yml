name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The php, assets and agent jobs run on this project's own Jogger instance. The browser job stays on a
# GitHub-hosted runner: it needs Chrome, which the Jogger runner image does not ship.
jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: [self-hosted, linux, x64] # Jogger pool "jogger-linux-x64"
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: jogger
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: jogger_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U jogger -d jogger_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql, redis, intl, mbstring
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Lint (Pint)
        run: make lint

      - name: Static analysis (Larastan)
        run: make stan

      - name: Tests (PHPUnit)
        run: make test

  browser:
    name: Browser (Dusk)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: jogger
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: jogger_dusk
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U jogger -d jogger_dusk"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, redis, intl, mbstring
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Build assets
        run: |
          npm ci
          npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          cp .env.dusk.example .env.dusk.local
          sed -i 's/^REDIS_PORT=.*/REDIS_PORT=6379/' .env.dusk.local

      - name: Install ChromeDriver matching the runner's Chrome
        run: php artisan dusk:chrome-driver --detect

      - name: Browser tests
        run: tests/Browser/run.sh

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: dusk-failure
          path: |
            tests/Browser/screenshots
            tests/Browser/console
            storage/logs/dusk-*.log
          if-no-files-found: ignore

  assets:
    name: Frontend build
    runs-on: [self-hosted, linux, x64] # Jogger pool "jogger-linux-x64"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run build

  agent:
    name: Agent (Go)
    runs-on: [self-hosted, linux, x64] # Jogger pool "jogger-linux-x64"
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - run: go vet ./...

      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64
          # Built from source with the job's Go: the released binary refuses a newer Go than it was built with.
          install-mode: goinstall
          working-directory: agent

      # The Docker integration tests skip themselves unless this image is present locally.
      - run: docker pull alpine:latest

      - run: go test -race ./...

      - name: Cross-compile (amd64, arm64)
        run: make build-all

      - name: Build (size check)
        run: |
          make build
          test "$(stat -c %s bin/jogger-agent)" -lt 20971520
