name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  # Each architecture builds on a native runner (the emulated arm64 build of the server image never finished) and
  # pushes by digest; the `images` job then stitches the two into one multi-arch tag.
  build:
    name: build (${{ matrix.image }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        image: [jogger, jogger-agent]
        arch: [amd64, arm64]
        include:
          - {image: jogger, file: docker/app/Dockerfile}
          - {image: jogger-agent, file: docker/agent/Dockerfile}
          - {arch: amd64, runner: ubuntu-latest}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name and version
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.image }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          echo "name=ghcr.io/${OWNER,,}/${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/${{ matrix.arch }}
          build-args: |
            VERSION=${{ steps.image.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}-${{ matrix.image }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error

  images:
    name: images (${{ matrix.image }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [jogger, jogger-agent]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-*-${{ matrix.image }}
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the multi-arch tags
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.image }}
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        working-directory: ${{ runner.temp }}/digests
        run: |
          name="ghcr.io/${OWNER,,}/${IMAGE}"
          tags=(-t "${name}:${TAG#v}")
          # A pre-release never moves :latest, which is what the install guide pulls.
          if [ "$PRERELEASE" != "true" ]; then tags+=(-t "${name}:latest"); fi
          docker buildx imagetools create "${tags[@]}" $(printf "${name}@sha256:%s " *)
          docker buildx imagetools inspect "${name}:${TAG#v}"

  assets:
    name: Agent binaries and install bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: Build agent binaries
        working-directory: agent
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          make build-all VERSION="${TAG#v}"
          test "$(./bin/jogger-agent-linux-amd64 --version)" != ""
          ./bin/jogger-agent-linux-amd64 --version | grep -F "${TAG#v}"

      - name: Assemble assets
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir dist
          cp agent/bin/jogger-agent-linux-* dist/
          # Everything needed to install the server without cloning the repository.
          tar -czf "dist/jogger-compose-${TAG#v}.tar.gz" \
            docker/compose/docker-compose.yml docker/caddy/Caddyfile .env.production.example docs/INSTALL.md
          cd dist && sha256sum * > SHA256SUMS && sha256sum -c SHA256SUMS

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber
