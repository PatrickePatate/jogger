name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: jogger
            file: docker/app/Dockerfile
          - image: jogger-agent
            file: docker/agent/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name and tags
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.image }}
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          name="ghcr.io/${OWNER,,}/${IMAGE}"
          version="${TAG#v}"
          {
            echo "version=${version}"
            echo "tags<<EOF"
            echo "${name}:${version}"
            # A pre-release never moves :latest, which is what the install guide pulls.
            if [ "$PRERELEASE" != "true" ]; then echo "${name}:latest"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.image.outputs.version }}
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  assets:
    name: Agent binaries and install bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: Build agent binaries
        working-directory: agent
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          make build-all VERSION="${TAG#v}"
          test "$(./bin/jogger-agent-linux-amd64 --version)" != ""
          ./bin/jogger-agent-linux-amd64 --version | grep -F "${TAG#v}"

      - name: Assemble assets
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir dist
          cp agent/bin/jogger-agent-linux-* dist/
          # Everything needed to install the server without cloning the repository.
          tar -czf "dist/jogger-compose-${TAG#v}.tar.gz" \
            docker/compose/docker-compose.yml docker/caddy/Caddyfile .env.production.example docs/INSTALL.md
          cd dist && sha256sum * > SHA256SUMS && sha256sum -c SHA256SUMS

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber
